<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Drive Player</title>
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
</head>
<body>
  <header class="topbar">
    <strong>Drive Player</strong>
  </header>

  <main>
    <section class="card">
      <form id="folderForm" class="row">
        <input id="folderInput" placeholder="Public Google Drive folder link" autocomplete="off" inputmode="url">
        <button class="btn primary">Open</button>
      </form>
      <p class="muted small">Folder ya file "Anyone with the link" bhayeko huna parchha.</p>
    </section>

    <section class="card">
      <div class="crumbs">
        <button id="backBtn" class="btn ghost small" hidden>Back</button>
        <span id="crumbs" class="muted"></span>
      </div>
      <ul id="files" class="list"></ul>
      <button id="moreBtn" class="btn ghost hidden">Load more</button>
      <p id="status" class="muted"></p>
    </section>

    <section class="card">
      <h2>Offline</h2>
      <ul id="offline" class="list"></ul>
      <p id="offlineEmpty" class="muted">Download gareko file yaha dekhincha.</p>
    </section>
  </main>

  <div id="player" class="player hidden">
    <div class="player-head">
      <span id="nowName"></span>
      <button id="closePlayer" class="btn ghost small" aria-label="Close player">Close</button>
    </div>
    <video id="video" controls playsinline hidden></video>
    <audio id="audio" controls hidden></audio>
    <div id="playerSource" class="muted small"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
